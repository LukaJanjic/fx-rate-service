name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/FxRateService.UnitTests --no-build -c Release

      - name: Integration tests
        run: dotnet test tests/FxRateService.IntegrationTests --no-build -c Release

      - name: Docker build
        run: docker build -f src/FxRateService.Api/Dockerfile -t fx-api .